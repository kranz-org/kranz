<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Kranz workflow concepts</title><desc id="desc">Three flows show dependency start, one-shot actions, and quit behavior for process and detached services.</desc>
  <style>text{font:600 17px ui-sans-serif,system-ui;fill:#172033}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.edge{fill:none;stroke:#0ea5e9;stroke-width:3}.green{stroke:#22c55e}.note{font-size:14px;fill:#526176}.heading{font-size:20px;fill:#0284c7}@media(prefers-color-scheme:dark){text{fill:#e7edf5}.box{fill:#111923;stroke:#526176}.note{fill:#9aa8b8}.heading{fill:#38bdf8}}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#0ea5e9"/></marker></defs>
  <text class="heading" x="30" y="35">Start a dependent service</text>
  <rect class="box" x="30" y="55" width="180" height="55" rx="9"/><text x="120" y="89" text-anchor="middle">press s on web</text><rect class="box" x="295" y="55" width="150" height="55" rx="9"/><text x="370" y="89" text-anchor="middle">start api</text><rect class="box" x="530" y="55" width="190" height="55" rx="9"/><text x="625" y="80" text-anchor="middle">wait for API</text><text class="note" x="625" y="100" text-anchor="middle">readiness</text><rect class="box" x="805" y="55" width="150" height="55" rx="9"/><text x="880" y="89" text-anchor="middle">start web</text>
  <path class="edge" d="M210 82H295" marker-end="url(#arrow)"/><path class="edge" d="M445 82H530" marker-end="url(#arrow)"/><path class="edge" d="M720 82H805" marker-end="url(#arrow)"/>
  <text class="heading" x="30" y="175">Run an action</text><rect class="box" x="30" y="195" width="230" height="55" rx="9"/><text x="145" y="229" text-anchor="middle">run migrate action</text><rect class="box" x="365" y="195" width="300" height="55" rx="9"/><text x="515" y="218" text-anchor="middle">execute once</text><text class="note" x="515" y="239" text-anchor="middle">record output and exit code</text><path class="edge" d="M260 222H365" marker-end="url(#arrow)"/>
  <text class="heading" x="30" y="315">Quit Kranz</text><rect class="box" x="30" y="335" width="180" height="55" rx="9"/><text x="120" y="369" text-anchor="middle">confirm quit</text><rect class="box" x="330" y="305" width="300" height="55" rx="9"/><text x="480" y="328" text-anchor="middle">process-supervised</text><text class="note" x="480" y="349" text-anchor="middle">stop owned process groups</text><rect class="box" x="330" y="380" width="300" height="55" rx="9"/><text x="480" y="403" text-anchor="middle">detached + stop_on_exit: false</text><text class="note" x="480" y="424" text-anchor="middle">leave external resource running</text><path class="edge" d="M210 362C265 362 275 332 330 332" marker-end="url(#arrow)"/><path class="edge green" d="M210 362C265 362 275 407 330 407" marker-end="url(#arrow)"/>
</svg>
